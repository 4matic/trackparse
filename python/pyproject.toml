[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trackparse"
version = "0.2.1"
description = "Spec-driven parser for music track titles: artists, feat, remixes, versions, junk, positions."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksim Maksimov" }]
keywords = [
  "music",
  "track",
  "title",
  "parser",
  "artist",
  "remix",
  "featuring",
  "metadata",
  "youtube",
  "id3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/4matic/trackparse"
Repository = "https://github.com/4matic/trackparse"
Issues = "https://github.com/4matic/trackparse/issues"
Changelog = "https://github.com/4matic/trackparse/blob/main/python/CHANGELOG.md"
Specification = "https://github.com/4matic/trackparse/blob/main/spec/SPEC.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "jsonschema>=4.18",
  "ruff>=0.6",
  "mypy>=1.10",
  "twine>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackparse"]

[tool.hatch.build.targets.sdist]
include = ["src/trackparse", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "scripts"]
extend-exclude = ["src/trackparse/_data.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Optional[X] stays: `X | None` is not evaluable at runtime on Python 3.9.
ignore = ["RUF001", "RUF002", "RUF003", "UP007", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
