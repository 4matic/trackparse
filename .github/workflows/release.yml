name: release

# release-please keeps a "chore: release" PR up to date from conventional commits on main.
# Merging that PR tags js-vX.Y.Z / spec-vX.Y.Z / python-vX.Y.Z, creates the GitHub Releases, and
# publishes to npm and PyPI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      js_release_created: ${{ steps.release.outputs['js--release_created'] }}
      js_tag_name: ${{ steps.release.outputs['js--tag_name'] }}
      js_version: ${{ steps.release.outputs['js--version'] }}
      python_release_created: ${{ steps.release.outputs['python--release_created'] }}
      python_tag_name: ${{ steps.release.outputs['python--tag_name'] }}
      python_version: ${{ steps.release.outputs['python--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A PAT or GitHub App token lets CI run on the release PR; GITHUB_TOKEN-created PRs don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.js_release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/trackparse/v/${{ needs.release-please.outputs.js_version }}
    permissions:
      contents: write # upload the tarball to the GitHub Release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.js_tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Verify versions are in sync
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.js_version }}
        run: |
          js_version=$(node -p "require('./js/package.json').version")
          spec_version=$(cat spec/VERSION)
          tag_version="$TAG_VERSION"
          echo "js=$js_version spec=$spec_version tag=$tag_version"
          test "$js_version" = "$tag_version"
          test "$spec_version" = "$tag_version"
          pnpm --filter trackparse gen:data:check

      - name: Test and build
        run: |
          pnpm --filter trackparse lint
          pnpm --filter trackparse typecheck
          pnpm --filter trackparse test
          pnpm --filter trackparse build

      - name: Package checks
        working-directory: js
        run: |
          pnpm exec publint
          pnpm exec attw --pack . --profile node16
          npm pack
          ls -l trackparse-*.tgz

      # Trusted publishing (OIDC): npmjs.com trusts 4matic/trackparse, release.yml, environment "npm".
      # No token is stored anywhere; npm also generates provenance automatically.
      - name: Publish to npm
        working-directory: js
        run: npm publish trackparse-*.tgz --access public --provenance

      - name: Attach tarball and install notes to the GitHub Release
        working-directory: js
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.js_tag_name }}
          VERSION: ${{ needs.release-please.outputs.js_version }}
        run: |
          gh release upload "$TAG" trackparse-*.tgz --clobber
          highlights="../.github/release-notes/${VERSION}.md"
          : > notes.md
          if [ -f "$highlights" ]; then
            cat "$highlights" >> notes.md
            printf '\n## Changelog\n\n' >> notes.md
          fi
          gh release view "$TAG" --json body --jq .body >> notes.md
          cat >> notes.md <<EOF

          ---

          ### Install

          \`\`\`sh
          npm install trackparse@${VERSION}
          \`\`\`

          npm: https://www.npmjs.com/package/trackparse/v/${VERSION} · implements spec ${VERSION} ([SPEC.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/spec/SPEC.md))
          EOF
          # js and spec release together; the npm package is the one to show as "Latest".
          gh release edit "$TAG" --notes-file notes.md --latest

  publish-pypi:
    needs: release-please
    if: needs.release-please.outputs.python_release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trackparse/${{ needs.release-please.outputs.python_version }}/
    permissions:
      contents: write # upload the wheel + sdist to the GitHub Release
      id-token: write # PyPI trusted publishing (OIDC) + attestations
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.python_tag_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          # No cache in the publishing job: nothing restored from a cache ends up in the release.
          enable-cache: false

      - name: Verify versions are in sync
        env:
          TAG_VERSION: ${{ needs.release-please.outputs.python_version }}
        run: |
          py_version=$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')
          js_version=$(python3 -c 'import json; print(json.load(open("js/package.json"))["version"])')
          spec_version=$(cat spec/VERSION)
          echo "python=$py_version js=$js_version spec=$spec_version tag=$TAG_VERSION"
          test "$py_version" = "$TAG_VERSION"
          test "$js_version" = "$TAG_VERSION"
          test "$spec_version" = "$TAG_VERSION"

      - name: Test
        working-directory: python
        run: |
          uv sync --locked
          uv run python scripts/gen_data.py --check
          uv run pytest

      - name: Build and check
        working-directory: python
        run: |
          rm -rf dist
          uv build
          uvx twine check dist/*
          ls -l dist

      # Trusted publishing (OIDC): pypi.org trusts 4matic/trackparse, release.yml, environment "pypi".
      # No token is stored anywhere; the action also uploads PEP 740 attestations by default.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

      - name: Attach wheel + sdist and install notes to the GitHub Release
        working-directory: python
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.python_tag_name }}
          VERSION: ${{ needs.release-please.outputs.python_version }}
        run: |
          gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber
          highlights="../.github/release-notes/${VERSION}.md"
          : > notes.md
          if [ -f "$highlights" ]; then
            cat "$highlights" >> notes.md
            printf '\n## Changelog\n\n' >> notes.md
          fi
          gh release view "$TAG" --json body --jq .body >> notes.md
          cat >> notes.md <<EOF

          ---

          ### Install (Python)

          \`\`\`sh
          pip install trackparse==${VERSION}
          \`\`\`

          PyPI: https://pypi.org/project/trackparse/${VERSION}/ · implements spec ${VERSION} ([SPEC.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/spec/SPEC.md))
          EOF
          # The npm release (js-vX.Y.Z) stays "Latest"; don't touch that flag here.
          gh release edit "$TAG" --notes-file notes.md
