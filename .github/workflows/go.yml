name: go

on:
  push:
    branches: [main]
  # The fuzz job: weekly, or by hand.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "go/**"
      - "spec/**"
      # The tests read the R0 primitives dumped from JS there.
      - "rust/tests/data/**"
      # The compare job diffs the module against the built JS package.
      - "js/src/**"
      - "scripts/compare-ports.mjs"
      - "scripts/lib/ports.mjs"
      - ".github/workflows/go.yml"

permissions:
  contents: read

env:
  # Test with the toolchain of the matrix, never an automatic download.
  GOTOOLCHAIN: local

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable, and the floor from go/go.mod (the `go` line).
        go: [stable, "1.22.x"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Data codegen is up to date
        run: node scripts/gen_data.mjs --check
      - name: Unicode codegen is up to date
        run: node scripts/gen_unicode.mjs --check
      - if: matrix.go == 'stable'
        name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - if: matrix.go == 'stable'
        name: staticcheck
        env:
          GOTOOLCHAIN: auto
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: No unstable sorts
        # JS sorts are stable; sort.Slice is not. Use slices.SortStableFunc.
        run: "! grep -n 'sort\\.Slice(' --include='*.go' -r ."
      - name: go.mod has no dependencies
        run: "! grep -q '^require' go.mod"
      # Every shared fixture, the primitives and the API tests.
      - run: go test -race ./...

  # Every fixture input through the built JS package and the Go module: full outputs must match.
  compare:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter trackparse build
      - run: node scripts/compare-ports.mjs --only=go

  # The module as the Go proxy will serve it: only what `git archive` puts under go/, without
  # ../spec or ../rust. The fixture and primitive tests must skip; everything else must pass.
  module-zip:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - name: Build and test go/ alone
        run: |
          dir="$(mktemp -d)"
          git archive HEAD go/ | tar -x -C "$dir"
          cd "$dir/go"
          test -z "$(find .. -maxdepth 1 -mindepth 1 ! -name go)"
          if grep -q '^require' go.mod; then echo "go.mod has dependencies"; exit 1; fi
          go vet ./...
          go test -count=1 ./...

  # Each fuzz target for a fixed time, seeded with every fixture input. Weekly and by hand.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # FuzzParse checks every mode per input and spends its first minute or so on the seeds.
        include:
          - { target: FuzzParse, time: 5m }
          - { target: FuzzParseArtists, time: 3m }
          - { target: FuzzFormat, time: 3m }
          - { target: FuzzParseTracklist, time: 3m }
          - { target: FuzzApplyEdits, time: 3m }
          - { target: FuzzRun, time: 3m }
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: false
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ matrix.time }} .
      - if: failure()
        name: Keep the failing input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}
          path: go/testdata/fuzz
          if-no-files-found: ignore
